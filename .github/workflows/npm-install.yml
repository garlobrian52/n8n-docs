name: npm install

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  install:
    name: npm install and format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm install
      - name: Check formatting
        run: npm run format:check
